  const n = document.createElement("span");
  n.className = "n";
  n.textContent = String(count).padStart(2, "0");
  b.appendChild(n);
  b.addEventListener("click", () => {
    state.cat = value;
    render();
  });
  tabsEl.appendChild(b);
  tabBtns.push(b);
}

makeTab("すべて", sites.length, -1);
chapters.forEach((ch, i) => {
  makeTab(ch.title, sites.filter((s) => s.c === i).length, i);
});

let index = 0;
chapters.forEach((ch, ci) => {
  const sec = document.createElement("section");
  sec.className = "chapter";
  const head = document.createElement("header");
  head.className = "chapter-head";
  const r = document.createElement("span");
  r.className = "roman";
  r.textContent = roman[ci];
  const h = document.createElement("div");
  const h2 = document.createElement("h2");
  h2.textContent = ch.title;
  const note = document.createElement("p");
  note.textContent = ch.note;
  h.append(h2, note);
  const cnt = document.createElement("span");
  cnt.className = "count";
  head.append(r, h, cnt);
  const ol = document.createElement("ol");
  ol.className = "grid";

  sites.forEach((site) => {
    if (site.c !== ci) return;
    index += 1;
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "entry";
    a.href = site.url;
    a.target = "_blank";
    a.rel = "noopener";

    const idx = document.createElement("span");
    idx.className = "idx";
    idx.textContent = String(index).padStart(2, "0");

    const title = document.createElement("h3");
    title.className = "title";
    title.textContent = site.name;

    const desc = document.createElement("p");
    desc.className = "desc";
    desc.textContent = site.desc;

    const meta = document.createElement("div");
    meta.className = "meta";
    const host = document.createElement("span");
    host.className = "host";
    try { host.textContent = new URL(site.url).hostname; } catch (e) { host.textContent = ""; }
    meta.appendChild(host);
    if (site.caution) {
      const c = document.createElement("span");
      c.className = "caution";
      c.textContent = "利用規約を確認";
      meta.appendChild(c);
    }

    const arrow = document.createElement("span");
    arrow.className = "arrow";
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = "↗";

    a.append(idx, title, desc, meta, arrow);
    li.appendChild(a);
    ol.appendChild(li);
    entries.push({ li, a, ch: ci, text: (site.name + " " + site.desc).toLowerCase(), name: site.name });
  });

  sec.append(head, ol);
  root.appendChild(sec);
  chapterEls.push({ sec, cnt, total: sites.filter((s) => s.c === ci).length });
});

function render() {
  const q = state.q.trim().toLowerCase();
  let shown = 0;
  entries.forEach((e) => {
    const ok = (state.cat === -1 || e.ch === state.cat) && (!q || e.text.includes(q));
    e.li.hidden = !ok;
    if (ok) shown += 1;
  });
  chapterEls.forEach((c, i) => {
    const visible = c.sec.querySelectorAll("li:not([hidden])").length;
    c.sec.hidden = visible === 0;
    c.cnt.textContent = String(visible).padStart(2, "0") + " / " + String(c.total).padStart(2, "0");
    c.sec.hidden = visible === 0;
  });
  tabBtns.forEach((b) => {
    b.setAttribute("aria-pressed", String(Number(b.dataset.value) === state.cat));
  });
  emptyEl.hidden = shown !== 0;
  statusEl.textContent = (state.q || state.cat !== -1)
    ? shown + " 件 表示中（全 " + sites.length + " 件）"
    : "全 " + sites.length + " 件を掲載しています";
}

qEl.addEventListener("input", () => {
  state.q = qEl.value;
  render();
});

document.addEventListener("keydown", (ev) => {
  if (ev.key === "/" && document.activeElement !== qEl && !ev.metaKey && !ev.ctrlKey) {
    ev.preventDefault();
    qEl.focus();
  }
  if (ev.key === "Escape" && document.activeElement === qEl) {
    qEl.value = "";
    state.q = "";
    render();
  }
});

pickBtn.addEventListener("click", () => {
  const visible = entries.filter((e) => !e.li.hidden);
  entries.forEach((e) => e.a.classList.remove("picked"));
  if (visible.length === 0) {
    statusEl.textContent = "選べるサイトがありません。";
    return;
  }
  const pick = visible[Math.floor(Math.random() * visible.length)];
  pick.a.classList.add("picked");
  pick.a.scrollIntoView({ behavior: "smooth", block: "center" });
  pick.a.focus({ preventScroll: true });
  statusEl.textContent = "「" + pick.name + "」を選びました。開くにはカードを押してください";
});

render();
</script>

</body></html>
